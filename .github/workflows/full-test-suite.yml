name: Full repository test suite

on:
  push:
    branches:
      - audit/foundation-repair
  pull_request:
    branches:
      - main

jobs:
  full-test-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch
        run: python -m pip install --upgrade pip && python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project and test dependencies
        run: >
          python -m pip install
          pytest numpy scipy scikit-learn torch-geometric
          opencv-python-headless pyyaml pandas matplotlib pillow

      - name: Run the complete test directory
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests
