name: Core feature tests

on:
  push:
    branches:
      - audit/foundation-repair
  pull_request:
    branches:
      - main

jobs:
  core-feature-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest numpy

      - name: Run core feature tests
        env:
          PYTHONPATH: src
        run: >
          python -m pytest -q
          tests/test_acceleration_features.py
          tests/test_position_features.py
          tests/test_velocity_features.py
          tests/test_motion_features.py
          tests/test_temporal_features.py
          tests/test_canonical_motion_features.py
          tests/test_motion_normalization.py
          tests/test_motion_pipeline_integration.py
          tests/test_feature_store.py
          tests/test_track_id_contract.py
          tests/test_dataset_builder.py
          tests/test_error_analysis.py
          tests/test_feature_diagnostics.py
          tests/test_event_analytics_track_ids.py
          tests/test_annotation_schema.py
          tests/test_annotation_loader.py
          tests/test_temporal_sample.py
          tests/test_group_splitter_ids.py
          tests/normalization.py
          tests/test_graph.py
          tests/test_temporal_graph_builder.py
          tests/test_spatiotemporal_graph_builder.py
          tests/test_tracker.py
          tests/test_joint_angle_features.py
          tests/test_lightweight_model_imports.py
          tests/pipeline
